<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookStore</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="page">
    <div class="page-head">
      <h2 id="form-title">Новая книга</h2>
      <a class="btn btn-outline" href="/static/catalog.html">← К каталогу</a>
    </div>

    <form class="form-card" id="book-form" novalidate>
      <div class="form-layout">
        <div class="cover-box">
          <div class="cover-preview"><img id="preview" class="placeholder" src="/static/img/picture.png" alt="Обложка"></div>
          <input type="file" id="image" accept="image/jpeg,image/png,image/webp" hidden>
          <button type="button" class="btn btn-outline" id="pick-image">Выбрать обложку</button>
          <button type="button" class="btn btn-outline" id="clear-image" hidden>Убрать обложку</button>
          <span class="hint">JPG, PNG или WEBP до 2 МБ. Изображение больше 400×400 px система уменьшит автоматически.</span>
        </div>

        <div class="form-grid">
          <div class="field">
            <label for="article">Артикул *</label>
            <input class="input" id="article" name="article" required maxlength="20" placeholder="BK021">
          </div>
          <div class="field">
            <label for="publication_date">Дата издания *</label>
            <input class="input" id="publication_date" name="publication_date" type="date" required>
          </div>
          <div class="field wide">
            <label for="title">Название *</label>
            <input class="input" id="title" name="title" required maxlength="200">
          </div>
          <div class="field">
            <label for="author">Автор *</label>
            <input class="input" id="author" name="author" required maxlength="150" list="authors-list">
            <datalist id="authors-list"></datalist>
          </div>
          <div class="field">
            <label for="genre_id">Жанр *</label>
            <select class="input" id="genre_id" name="genre_id" required></select>
          </div>
          <div class="field">
            <label for="publisher_id">Издатель *</label>
            <select class="input" id="publisher_id" name="publisher_id" required></select>
          </div>
          <div class="field">
            <label for="rating">Рейтинг (0–5)</label>
            <input class="input" id="rating" name="rating" type="number" min="0" max="5" step="0.1" value="0">
          </div>
          <div class="field">
            <label for="price">Стоимость, ₽ *</label>
            <input class="input" id="price" name="price" type="number" min="0" step="0.01" required>
          </div>
          <div class="field">
            <label for="stock">Количество на складе *</label>
            <input class="input" id="stock" name="stock" type="number" min="0" step="1" required>
          </div>
          <label class="check wide"><input type="checkbox" id="is_ebook" name="is_ebook"> Электронная книга (E-book)</label>
          <div class="field wide">
            <label for="description">Описание</label>
            <textarea class="input" id="description" name="description" rows="4"></textarea>
          </div>
        </div>
      </div>

      <div class="alert alert-error" id="error" hidden style="margin-top:16px"></div>

      <div class="form-actions">
        <button type="button" class="btn btn-danger" id="delete" hidden>Удалить книгу</button>
        <span class="spacer"></span>
        <a class="btn btn-outline" href="/static/catalog.html">Отмена</a>
        <button type="submit" class="btn" id="save">Сохранить</button>
      </div>
    </form>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/book-form.js"></script>
</body>
</html>
