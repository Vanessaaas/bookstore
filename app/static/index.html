<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookStore — Авторизация</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
  <form class="login-card" id="login-form" novalidate>
    <img class="logo" src="/static/img/Icon.png" alt="Логотип BookStore">
    <h1>BookStore</h1>
    <p>Войдите под учётной записью сотрудника</p>

    <div class="field">
      <label for="login">Логин</label>
      <input class="input" id="login" name="login" autocomplete="username" required maxlength="50">
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required maxlength="100">
    </div>

    <div class="alert alert-error" id="error" hidden></div>

    <button class="btn" type="submit" id="submit">Войти</button>
    <div class="divider">или</div>
    <button class="btn btn-outline" type="button" id="guest">Войти как гость</button>
  </form>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
